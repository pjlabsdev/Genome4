[workspace]
resolver = "2"
members = ["crates/gc-align", "crates/gc-bam", "crates/gc-gpu", "crates/gc-index", "crates/gc-io", "crates/gc-log", "crates/gc-panel", "crates/gc-schema", "crates/gc-sys", "crates/genome"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
libc = "0.2"
noodles = { version = "0.119", features = ["bam", "sam", "bgzf"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
gc-align = { path = "crates/gc-align" }
gc-bam = { path = "crates/gc-bam" }
gc-gpu = { path = "crates/gc-gpu" }
gc-index = { path = "crates/gc-index" }
gc-io = { path = "crates/gc-io" }
gc-log = { path = "crates/gc-log" }
gc-panel = { path = "crates/gc-panel" }
gc-schema = { path = "crates/gc-schema" }
gc-sys = { path = "crates/gc-sys" }

[profile.release]
lto = "fat"
codegen-units = 1
