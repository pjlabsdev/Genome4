[workspace]
resolver = "2"
members = ["crates/gc-io", "crates/gc-schema", "crates/genome"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
noodles = { version = "0.119", features = ["bam", "sam", "bgzf"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
gc-io = { path = "crates/gc-io" }
gc-schema = { path = "crates/gc-schema" }

[profile.release]
lto = "fat"
codegen-units = 1
